name: Build TV APK

# Builds the Loop Network Fire TV / Android TV kiosk APK in the cloud (no local
# Android SDK needed) and publishes it to a stable release asset so hosts can
# install it from loopnetwork.org/app.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk loop-network-tv.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-network-tv-apk
          path: loop-network-tv.apk

      - name: Publish to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Loop Network TV app (latest)
          files: loop-network-tv.apk
          prerelease: false
