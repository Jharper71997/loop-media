name: Build TV APK

# Builds the Loop Network Fire TV / Android TV kiosk APK in the cloud (no local
# Android SDK needed) and publishes it to a stable release asset so hosts can
# install it from loopnetwork.org/app.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships a full Android SDK. The setup-android action
      # broke on the current image (its license auto-accept mis-parses the
      # newer preinstalled cmdline-tools), so we accept licenses and install the
      # exact packages this build needs directly against the preinstalled SDK.
      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional stable signing key. With it, a new build installs OVER the one
      # already on a TV (adb install -r); without it the build falls back to the
      # runner's throwaway debug key and updating a screen means uninstalling
      # first, which wipes its pairing. See tv-app/README.md for creating it.
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.LOOP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/loop-release.jks"
            echo "LOOP_KEYSTORE_PATH=$RUNNER_TEMP/loop-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "No release keystore secret set; falling back to the debug key."
          fi

      - name: Build release APK
        working-directory: tv-app
        env:
          LOOP_KEYSTORE_PASSWORD: ${{ secrets.LOOP_KEYSTORE_PASSWORD }}
          LOOP_KEY_ALIAS: ${{ secrets.LOOP_KEY_ALIAS }}
          LOOP_KEY_PASSWORD: ${{ secrets.LOOP_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk loop-network-tv.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-network-tv-apk
          path: loop-network-tv.apk

      # Only main updates the live download at loopnetwork.org/app. Branch builds
      # and manual runs on a branch just upload the artifact above, so a
      # spare-stick / test APK never changes what real hosts install.
      - name: Publish to stable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Loop Network TV app (latest)
          files: loop-network-tv.apk
          prerelease: false
