plugins {
    id 'com.android.application'
}

android {
    namespace 'org.loopnetwork.tv'
    compileSdk 34

    defaultConfig {
        // NOTE: id intentionally differs from the namespace. Fire TV caches the
        // home-screen tile artwork keyed by applicationId and will NOT refresh it
        // on reinstall/reboot — a fresh id forces Fire TV to redraw the tile from
        // the current banner/icon. Bump this again if the tile ever gets stuck.
        applicationId "org.loopnetwork.kiosk"
        minSdk 22          // Fire OS 5 (API 22) and up
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the auto-generated debug key so the APK installs via
            // sideload with ZERO secret setup. The native shell almost never
            // changes — all product logic lives in loopnetwork.org/tv and
            // self-updates over the web — so stable release-key signing isn't
            // needed for v1. See README for the upgrade path.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: pure android.* framework classes keep the APK
// tiny and the CI build bulletproof (no androidx version matrix to satisfy).
dependencies {
}
