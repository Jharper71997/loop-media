plugins {
    id 'com.android.application'
}

android {
    namespace 'org.loopnetwork.tv'
    compileSdk 34

    defaultConfig {
        // NOTE: id intentionally differs from the namespace. Fire TV caches the
        // home-screen tile artwork keyed by applicationId and will NOT refresh it
        // on reinstall/reboot — a fresh id forces Fire TV to redraw the tile from
        // the current banner/icon. Bump this again if the tile ever gets stuck.
        applicationId "org.loopnetwork.kiosk"
        minSdk 22          // Fire OS 5 (API 22) and up
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    // A STABLE key, when CI has one. This mattered the moment screens became
    // remotely updatable: Android refuses `adb install -r` across a key change,
    // and the CI runner mints a FRESH debug keystore every run — so every build
    // was a different signer, and updating a wall-mounted TV meant uninstalling
    // (which wipes the pairing) instead of installing over the top. Set the
    // LOOP_KEYSTORE_* env vars in CI and every build from then on upgrades in
    // place. Absent them the build still works and still signs with the debug
    // key, so a local or forked build needs no secrets.
    signingConfigs {
        release {
            def storePath = System.getenv("LOOP_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                // PKCS12, which is both what keytool has produced since JDK 9 and
                // what openssl writes — the key for this fleet was made with
                // openssl, since the machine that made it has no JDK.
                storeType "PKCS12"
                storePassword System.getenv("LOOP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LOOP_KEY_ALIAS")
                keyPassword System.getenv("LOOP_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("LOOP_KEYSTORE_PATH")
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: pure android.* framework classes keep the APK
// tiny and the CI build bulletproof (no androidx version matrix to satisfy).
dependencies {
}
